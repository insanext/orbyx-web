<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B1428" />
  <title>Orbyx — Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #f8fbff, #eef4ff); color: #0f172a; padding: 16px; box-sizing: border-box; }
    .card { max-width: 360px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0 0 20px; line-height: 1.5; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Orbyx" />
    <h1>Sin conexión</h1>
    <p>No pudimos conectar con Orbyx. Revisa tu conexión a internet e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
